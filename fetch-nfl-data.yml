name: Fetch NFL survivor data

on:
  schedule:
    # Every day at 13:00 UTC (8 AM Eastern in winter). Edit to taste.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests pandas lxml

      - name: Fetch ESPN schedule, moneylines and futures
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional, for FanDuel lines
        run: python fetch_nfl_data.py --no-upload --out-dir data

      - name: Commit the data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update NFL survivor data $(date -u +%F)"
          git push
